name: Internet Computer Store Monitor
run-name: Internet Computer Store Monitor - ${{ github.event_name }} - ${{ github.ref_name }}

on:
  push:
    branches: [main, core17-staging-safe]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose an operation'
        type: choice
        required: true
        default: build
        options:
          - build
          - deploy
          - provision
          - initialize

permissions:
  contents: read

concurrency:
  group: catalog-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-validation:
    if: github.ref == 'refs/heads/core17-staging-safe'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Cloud v1 and Core tests
        run: |
          node --test core/cloud-v1/*.test.mjs
          node --test core/tests/*.test.mjs
      - name: Website tests and build
        run: |
          npm ci
          npm test
          npm run build

  real-discovery-readonly:
    if: github.ref == 'refs/heads/core17-staging-safe'
    needs: native-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real GitHub discovery (no cloud writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/catalog-review"
          node core/discovery/run.mjs --sources github --strict --out "$RUNNER_TEMP/catalog-review/candidates.json"
      - name: Robots-aware public crawl (max 3)
        run: |
          node core/crawl/prepare.mjs --in "$RUNNER_TEMP/catalog-review/candidates.json" --out "$RUNNER_TEMP/catalog-review/batch.json" --max 3 --scan 12
      - name: Verify discovery evidence, no checkpoint
        run: |
          node core/cloud-v1/real-discovery-proof.mjs "$RUNNER_TEMP/catalog-review/candidates.json" "$RUNNER_TEMP/catalog-review/batch.json"
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-native-discovery-review
          path: ${{ runner.temp }}/catalog-review/*.json
          if-no-files-found: ignore
          retention-days: 3

  pages-build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'build')
    name: Build GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'build')
    name: Deploy GitHub Pages
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish site
        id: deploy
        uses: actions/deploy-pages@v4


  execute:
    concurrency:
      group: catalog-cloud-operations
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'deploy' || inputs.operation == 'initialize')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
      CATALOG_API_BASE_URL: ${{ vars.CATALOG_API_BASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Check Cloudflare credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_ICPSTORE_API_TOKEN secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ICPSTORE_ACCOUNT_ID secret' >&2; exit 1; }
      - name: Initialize schema in the new D1 database
        if: inputs.operation == 'initialize'
        run: npx --yes wrangler@4 d1 execute icpstore-catalog-db-prod --remote --file=worker/schema-fresh.sql --config=worker/wrangler.jsonc --yes
      - name: Deploy new API Worker
        if: inputs.operation == 'deploy'
        run: npx --yes wrangler@4 deploy --config=worker/wrangler.jsonc


  provision-new-catalog:
    concurrency:
      group: catalog-cloud-operations
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'provision'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          npm test
      - name: Prepare only new queue and R2 notification
        run: node worker/provision-catalog.mjs
      - name: Deploy new catalog API
        run: npx --yes wrangler@4 deploy --config=worker/wrangler.jsonc
      - name: Resolve deployed API URL
        run: node worker/api-origin.mjs
      - name: Verify new API health and empty catalog access
        run: |
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/health" > "$RUNNER_TEMP/catalog-health.json"
          node -e "const d=require(process.argv[1]);if(d.ok!==true)process.exit(1);console.log('New API health check passed')" "$RUNNER_TEMP/catalog-health.json"
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/search?page=1&limit=1" > "$RUNNER_TEMP/catalog-result.json"
          node -e "const d=require(process.argv[1]);if(!Array.isArray(d.records)||!Number.isInteger(d.count))process.exit(1);console.log('New API published count:',d.count)" "$RUNNER_TEMP/catalog-result.json"


