name: Fresh production catalog
run-name: Fresh production catalog - ${{ inputs.operation }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-catalog.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: Select one operation. Run initialize, then deploy, then crawl.
        type: choice
        required: true
        options:
          - initialize
          - provision
          - deploy
          - crawl
permissions:
  contents: read
concurrency:
  group: fresh-production-catalog
  cancel-in-progress: false
jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'provision'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
      CATALOG_API_BASE_URL: ${{ vars.CATALOG_API_BASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Check Cloudflare credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_ICPSTORE_API_TOKEN secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ICPSTORE_ACCOUNT_ID secret' >&2; exit 1; }
      - name: Initialize schema in the new D1 database
        if: inputs.operation == 'initialize'
        run: npx --yes wrangler@4 d1 execute icpstore-catalog-db-prod --remote --file=worker/schema-fresh.sql --config=worker/wrangler.jsonc --yes
      - name: Deploy new API Worker
        if: inputs.operation == 'deploy'
        run: npx --yes wrangler@4 deploy --config=worker/wrangler.jsonc
      - name: Resolve the new API URL
        if: inputs.operation == 'crawl'
        run: node worker/api-origin.mjs
      - name: Verify the new API URL and health
        if: inputs.operation == 'crawl'
        run: |
          if [[ ! "$CATALOG_API_BASE_URL" =~ ^https://icpstore-catalog-api-prod\.[a-zA-Z0-9-]+\.workers\.dev$ ]]; then
            echo 'Set CATALOG_API_BASE_URL to the new Worker origin before crawling.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/health" > "$RUNNER_TEMP/catalog-health.json"
          node -e "const d=require(process.argv[1]);if(d.ok!==true)process.exit(1)" "$RUNNER_TEMP/catalog-health.json"
      - name: Discover SNS and Caffeine projects
        if: inputs.operation == 'crawl'
        run: |
          node crawler/run.mjs --only=sns
          node crawler/caffeine-discover.mjs data/caffeine-seeds.txt "$RUNNER_TEMP/caffeine-candidates.json"
          node crawler/fresh-batches.mjs data/projects.json "$RUNNER_TEMP/caffeine-candidates.json" "$RUNNER_TEMP/catalog-imports"
      - name: Upload batches to the new R2 bucket
        if: inputs.operation == 'crawl'
        run: |
          set -eu
          for file in "$RUNNER_TEMP"/catalog-imports/*.json; do
            test -f "$file"
            npx --yes wrangler@4 r2 object put "icpstore-catalog-files-prod/imports/v3/$(basename "$file")" --file="$file" --remote --content-type=application/json
          done
          echo 'Uploaded batches. The configured R2 notification and Queue must process them into D1.'
      - name: Verify published projects appear in the new API
        if: inputs.operation == 'crawl'
        run: |
          set -eu
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 15 "$CATALOG_API_BASE_URL/api/search?page=1&limit=1" > "$RUNNER_TEMP/catalog-result.json" && node -e "const d=require(process.argv[1]);if(!Array.isArray(d.records)||d.count<1)process.exit(1);console.log('Published projects:',d.count)" "$RUNNER_TEMP/catalog-result.json"; then
              exit 0
            fi
            sleep 4
          done
          echo 'No published projects appeared. Check the R2 notification, Queue and Worker logs.' >&2
          exit 1

  provision-new-catalog:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && github.event.head_commit.message == 'Provision fresh catalog services') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'provision'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          npm test
      - name: Prepare only new queue and R2 notification
        run: node worker/provision-catalog.mjs
      - name: Deploy new catalog API
        run: npx --yes wrangler@4 deploy --config=worker/wrangler.jsonc
      - name: Resolve deployed API URL
        run: node worker/api-origin.mjs
      - name: Verify new API health and empty catalog access
        run: |
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/health" > "$RUNNER_TEMP/catalog-health.json"
          node -e "const d=require(process.argv[1]);if(d.ok!==true)process.exit(1);console.log('New API health check passed')" "$RUNNER_TEMP/catalog-health.json"
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/search?page=1&limit=1" > "$RUNNER_TEMP/catalog-result.json"
          node -e "const d=require(process.argv[1]);if(!Array.isArray(d.records)||!Number.isInteger(d.count))process.exit(1);console.log('New API published count:',d.count)" "$RUNNER_TEMP/catalog-result.json"

  inspect-catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Inspect fresh catalog status'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect catalog counts and batches
        run: |
          npx --yes wrangler@4 d1 execute icpstore-catalog-db-prod --remote --config=worker/wrangler.jsonc --command="SELECT status,source_type,COUNT(*) AS total FROM search_entities_v3 GROUP BY status,source_type; SELECT object_key,status,accepted_count,rejected_count,processed_at FROM search_ingest_batches_v3 ORDER BY processed_at DESC;"
      - name: Inspect API
        run: node worker/api-origin.mjs
      - name: Check published count
        run: curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/search?page=1&limit=1"

      - name: Compare old and new catalog API and CORS
        run: |
          for origin in "https://ordoviworld-api.ordoviworld.workers.dev" "$CATALOG_API_BASE_URL"; do
            echo "Catalog: $origin"
            curl --fail --silent --show-error --max-time 20 "$origin/api/search?page=1&limit=1" | node -e "let t='';process.stdin.on('data',c=>t+=c);process.stdin.on('end',()=>{const d=JSON.parse(t);console.log('Published count:',d.count)})"
            curl --fail --silent --show-error --max-time 20 -o /dev/null -D - -H 'Origin: https://ristjwcheng.github.io' "$origin/api/search?page=1&limit=1" | grep -i '^access-control-allow-origin:' || true
          done

      - name: Verify deployed website configuration
        run: |
          curl --fail --silent --show-error --max-time 20 "https://ristjwcheng.github.io/internet-computer-store/api-config.json" | node -e "let t='';process.stdin.on('data',c=>t+=c);process.stdin.on('end',()=>{const d=JSON.parse(t);if(d.apiBaseUrl!==process.env.CATALOG_API_BASE_URL)process.exit(1);console.log('Deployed website uses new catalog API')})"

      - name: Inventory legacy resource names
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID;
          for (const [kind, path] of [['R2', '/r2/buckets'], ['D1', '/d1/database'], ['Workers', '/workers/scripts']]) {
            const response = await fetch(root + path, {headers: {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}});
            const data = await response.json();
            if (!response.ok || !data.success) { console.log(kind + ': unavailable (' + response.status + ')'); continue; }
            const rows = Array.isArray(data.result) ? data.result : data.result?.buckets ?? [];
            console.log(kind + ': ' + rows.map(x => x.name || x.id || x.script_name).filter(Boolean).join(', '));
          }
          NODE
