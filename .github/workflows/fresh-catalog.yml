name: Internet Computer Store Crawler
run-name: Internet Computer Store Crawler - manual
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-crawler
  cancel-in-progress: false
jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
      CATALOG_API_BASE_URL: ${{ vars.CATALOG_API_BASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Check Cloudflare credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_ICPSTORE_API_TOKEN secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ICPSTORE_ACCOUNT_ID secret' >&2; exit 1; }
      - name: Resolve the new API URL
        run: node worker/api-origin.mjs
      - name: Verify the new API URL and health
        run: |
          if [[ ! "$CATALOG_API_BASE_URL" =~ ^https://icpstore-catalog-api-prod\.[a-zA-Z0-9-]+\.workers\.dev$ ]]; then
            echo 'Set CATALOG_API_BASE_URL to the new Worker origin before crawling.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 "$CATALOG_API_BASE_URL/api/health" > "$RUNNER_TEMP/catalog-health.json"
          node -e "const d=require(process.argv[1]);if(d.ok!==true)process.exit(1)" "$RUNNER_TEMP/catalog-health.json"
      - name: Discover SNS and Caffeine projects
        run: |
          node crawler/run.mjs --only=sns
          node crawler/caffeine-discover.mjs data/caffeine-seeds.txt "$RUNNER_TEMP/caffeine-candidates.json"
          node crawler/fresh-batches.mjs data/projects.json "$RUNNER_TEMP/caffeine-candidates.json" "$RUNNER_TEMP/catalog-imports"
      - name: Upload batches to the new R2 bucket
        run: |
          set -eu
          for file in "$RUNNER_TEMP"/catalog-imports/*.json; do
            test -f "$file"
            npx --yes wrangler@4 r2 object put "icpstore-catalog-files-prod/imports/v3/$(basename "$file")" --file="$file" --remote --content-type=application/json
          done
          echo 'Uploaded batches. The configured R2 notification and Queue must process them into D1.'
      - name: Verify published projects appear in the new API
        run: |
          set -eu
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 15 "$CATALOG_API_BASE_URL/api/search?page=1&limit=1" > "$RUNNER_TEMP/catalog-result.json" && node -e "const d=require(process.argv[1]);if(!Array.isArray(d.records)||d.count<1)process.exit(1);console.log('Published projects:',d.count)" "$RUNNER_TEMP/catalog-result.json"; then
              exit 0
            fi
            sleep 4
          done
          echo 'No published projects appeared. Check the R2 notification, Queue and Worker logs.' >&2
          exit 1

