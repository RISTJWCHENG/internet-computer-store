name: Internet Computer Store Crawler
run-name: Internet Computer Store Crawler - ${{ github.event_name }}
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fresh-catalog.yml']
permissions:
  contents: write
concurrency:
  group: catalog-crawler
  cancel-in-progress: false
jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install crawler dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      # Historical Community seeds are empty; Community Apps awaits reviewed sources.
      - name: Discover fresh SNS projects and configured community seeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node crawler/run.mjs --only=sns
          node crawler/community-discover.mjs data/community-seeds.txt "$RUNNER_TEMP/community-candidates.json"
          node icp/scripts/prepare-catalog.mjs data/projects.json "$RUNNER_TEMP/community-candidates.json" "$RUNNER_TEMP/current.json"
      - name: Store screened public text results
        uses: actions/github-script@v7
        env:
          CATALOG_REPORT: ${{ runner.temp }}/current.json
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.CATALOG_REPORT);
            if (content.length > 16000000) throw new Error('Catalog report is too large');
            const path = 'data/catalog/current.json';
            let sha;
            try { const r = await github.rest.repos.getContent({...context.repo,path,ref:'main'}); sha = r.data.sha; }
            catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha,message:'Update screened catalog',content:content.toString('base64')});
      - name: Synchronize changed records to ICP
        env:
          NATIVE_INGEST_TOKEN: ${{ secrets.NATIVE_INGEST_TOKEN }}
        run: node icp/scripts/import-catalog.mjs "$RUNNER_TEMP/current.json"
