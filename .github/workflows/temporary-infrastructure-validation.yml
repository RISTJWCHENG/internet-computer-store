name: Temporary Infrastructure UI validation
on:
  push:
    branches: [main, infrastructure-resource-directory]
    paths: ['.github/workflows/temporary-infrastructure-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/infrastructure-resource-directory'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:backend
      - run: npm run test:icp
      - run: npm run build:icp
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
        id: browser_setup
      - run: node config/admin-ui-browser.mjs
      - run: node config/infrastructure-browser.mjs
        if: ${{ success() || (failure() && steps.browser_setup.outcome == 'success') }}
      - run: node icp/scripts/verify-frontend.mjs
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = 'infrastructure-resource-directory';
            let temporary;
            try { temporary = await github.rest.git.getRef({...context.repo,ref:'heads/'+branch}); }
            catch(e){if(e.status===404)return;throw e;}
            const main = await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            const comparison = await github.rest.repos.compareCommits({...context.repo,base:temporary.data.object.sha,head:main.data.object.sha});
            if(!['ahead','identical'].includes(comparison.data.status))throw new Error('Review branch is not fully merged');
            await github.rest.git.deleteRef({...context.repo,ref:'heads/'+branch});
