name: Temporary administrator diagnostic deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-admin-diagnostic.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: catalog-cloud-operations
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ICPSTORE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ICPSTORE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
      - run: npx --yes wrangler@4 deploy --config=worker/admin/wrangler.ii.jsonc
