name: Temporary administrator runtime verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-admin-diagnostic.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check verifier initializes and rejects an invalid proof
        run: |
          set -eu
          url=https://icpstore-catalog-admin-prod.ordoviworld.workers.dev
          origin=https://ristjwcheng.github.io
          curl --fail --silent --show-error -H "Origin: $origin" -H 'Content-Type: application/json' -d '{}' "$url/api/ii/challenge" > "$RUNNER_TEMP/challenge.json"
          node -e "const fs=require('fs');const c=require(process.argv[1]);fs.writeFileSync(process.argv[2],JSON.stringify({challenge:c,chain:{},signature:'00'}));" "$RUNNER_TEMP/challenge.json" "$RUNNER_TEMP/proof.json"
          status=$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/proof.json" "$url/api/ii/session")
          test "$status" = 401
          cat "$RUNNER_TEMP/result.json"
          node -e "const x=require(process.argv[1]);if(x.error!=='Authentication failed (identity verification).')process.exit(1)" "$RUNNER_TEMP/result.json"
