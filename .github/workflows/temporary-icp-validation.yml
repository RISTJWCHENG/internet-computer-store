name: Temporary ICP migration validation
on:
  push:
    branches: [icp-migration-validation]
    paths: ['.github/workflows/temporary-icp-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      - run: npm run test:icp
      - run: npm test
      - run: npm run build:icp
  fresh-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Discover and screen fresh public projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node crawler/run.mjs --only=sns
          node crawler/caffeine-discover.mjs data/caffeine-seeds.txt "$RUNNER_TEMP/caffeine.json"
          node icp/scripts/prepare-catalog.mjs data/projects.json "$RUNNER_TEMP/caffeine.json" "$RUNNER_TEMP/current.json"
      - name: Save screened results only on the temporary branch
        uses: actions/github-script@v7
        env:
          CATALOG_REPORT: ${{ runner.temp }}/current.json
        with:
          script: |
            if (context.ref !== 'refs/heads/icp-migration-validation') throw new Error('Unexpected branch');
            const fs = require('fs'); const path = 'data/catalog/current.json';
            const content = fs.readFileSync(process.env.CATALOG_REPORT);
            if (content.length > 16000000) throw new Error('Catalog report is too large');
            let sha;
            try { const r=await github.rest.repos.getContent({...context.repo,path,ref:'icp-migration-validation'});sha=r.data.sha; }
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'icp-migration-validation',sha,message:'Prepare fresh ICP catalog',content:content.toString('base64')});
      - name: Report public crawler principal without importing production data
        env:
          NATIVE_INGEST_TOKEN: ${{ secrets.NATIVE_INGEST_TOKEN }}
        run: node icp/scripts/import-catalog.mjs --identity-only
