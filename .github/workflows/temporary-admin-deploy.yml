name: Temporary administrator verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-admin-deploy.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check deployed access controls and challenge
        run: |
          set -eu
          url=https://icpstore-catalog-admin-prod.ordoviworld.workers.dev
          origin=https://ristjwcheng.github.io
          result=$(curl -sS -o "$RUNNER_TEMP/no-origin.json" -w '%{http_code}' "$url/api/projects")
          test "$result" = 403
          result=$(curl -sS -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' -H "Origin: $origin" "$url/api/projects")
          test "$result" = 401
          result=$(curl -sS -o "$RUNNER_TEMP/wrong-origin.json" -w '%{http_code}' -H 'Origin: https://example.com' -H 'Content-Type: application/json' -d '{}' "$url/api/ii/challenge")
          test "$result" = 403
          result=$(curl -sS -o "$RUNNER_TEMP/challenge.json" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' -d '{}' "$url/api/ii/challenge")
          test "$result" = 200
          node -e "const x=require(process.argv[1]);if(!/^[a-f0-9]{64}$/.test(x.nonce)||!/^[a-f0-9]{64}$/.test(x.mac))process.exit(1)" "$RUNNER_TEMP/challenge.json"
          result=$(curl -sS -o "$RUNNER_TEMP/forged.json" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' -d '{"challenge":{},"chain":{},"signature":"00"}' "$url/api/ii/session")
          test "$result" = 401
          echo 'Unauthenticated requests and forged proof rejected; challenge endpoint available.'
