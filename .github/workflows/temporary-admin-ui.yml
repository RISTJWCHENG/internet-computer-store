name: Temporary administrator interface verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-admin-ui.yml']
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium
      - run: node config/admin-ui-browser.mjs

# Test the root-path preview independently of the deployed site base.
